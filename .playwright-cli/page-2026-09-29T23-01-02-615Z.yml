    - generic [ref=e27]:
      - img "Dinner service in the Harvest Table dining room" [ref=e29]
      - heading "We opened because we were hungry." [level=1] [ref=e32]:
        - text: We opened
        - text: because we were
        - text: hungry.
    - region "Our story" [ref=e33]:
      - generic [ref=e35]:
        - generic [ref=e36]:
          - paragraph [ref=e37]: "Harvest Table opened in 2019 with eight tables, a wood-fired oven, and a handshake agreement with two farms down the road. The plan was simple: cook what was ripe, name where it came from, and get out of the way."
          - paragraph [ref=e38]: Our chef and founder, Daniel Park, spent twelve years in restaurant kitchens in San Francisco and Portland before moving to the Central Valley. He did not come here for the restaurant scene. He came because the farms were here.
          - paragraph [ref=e39]: The menu has never been the same two weeks in a row. We have served dishes we could not repeat if we tried, because the ingredient that made them possible was gone by the following Tuesday. That is not a problem. That is the point.
          - paragraph [ref=e40]: We now buy from 15 farms and makers. We seat forty guests a night for dinner Tuesday through Saturday, plus Sunday brunch. We have never put a dish on the menu that we were not proud of. We intend to keep it that way.
        - generic [ref=e41]:
          - img "Chef and founder Daniel Park preparing a dish in the Harvest Table kitchen" [ref=e43]
          - blockquote [ref=e44]:
            - paragraph [ref=e45]: “The best ingredient is always the one you did not plan for. That is why we do not lock our menu in advance.”
            - generic [ref=e46]: Daniel Park, Chef and Founder
    - region "How we cook" [ref=e47]:
      - generic [ref=e48]:
        - heading "How we cook" [level=2] [ref=e50]
        - generic [ref=e52]:
          - generic [ref=e53]:
            - heading "No dish lives forever" [level=3] [ref=e54]
            - paragraph [ref=e55]: When an ingredient goes out of season it comes off the menu. We do not source from outside California to extend a dish. When it is gone, it is gone until next year.
          - generic [ref=e56]:
            - heading "You will know the farmer" [level=3] [ref=e57]
            - paragraph [ref=e58]: Every dish names its source. We visit every farm personally before we list it on the menu. If we would not eat there, it does not appear on your plate.
          - generic [ref=e59]:
            - heading "Small on purpose" [level=3] [ref=e60]
            - paragraph [ref=e61]: Forty seats. Five dinners and one brunch a week. We are not trying to scale. We are trying to get dinner right, every night, for the people who show up.
    - region "Along the way" [ref=e62]:
      - generic [ref=e63]:
        - heading "Along the way" [level=2] [ref=e64]
        - list [ref=e65]:
