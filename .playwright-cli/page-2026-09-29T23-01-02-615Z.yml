          - listitem [ref=e69]:
            - paragraph [ref=e70]: "2021"
            - paragraph [ref=e71]: Grew to forty seats and started buying whole animals from local ranches.
          - listitem [ref=e72]:
            - paragraph [ref=e73]: "2023"
            - paragraph [ref=e74]: Opened the private dining room and hosted our first dinner in the vineyard.
          - listitem [ref=e75]:
            - paragraph [ref=e76]: "2026"
            - paragraph [ref=e77]: 15 farm partners, all within 60 miles of the kitchen.
